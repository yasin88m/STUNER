name: Deploy STUNER to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate application JavaScript
        run: node --check app.js && node --check curriculum.js && node --check sw.js
      - name: Inspect textbook catalog search form
        continue-on-error: true
        run: |
          python - <<'PY'
          import urllib.request
          from html.parser import HTMLParser
          class P(HTMLParser):
            def __init__(self):
              super().__init__(); self.title=""; self.intitle=False; self.forms=[]; self.form=None; self.links=[]; self.select=None; self.selects=[]; self.scripts=[]
            def handle_starttag(self,t,attrs):
              a=dict(attrs)
              if t=="title": self.intitle=True
              if t=="form": self.form={"attrs":a,"fields":[]}; self.forms.append(self.form)
              if self.form is not None and t in ("input","select","button"): self.form["fields"].append((t,a))
              if t=="select": self.select={"attrs":a,"options":[]}
              if t=="option" and self.select is not None: self.select["options"].append((a.get("value"),""))
              if t=="a" and a.get("href"): self.links.append((a.get("href"),a.get("title","")))
              if t=="script" and a.get("src"): self.scripts.append(a["src"])
            def handle_endtag(self,t):
              if t=="title": self.intitle=False
              if t=="form": self.form=None
              if t=="select" and self.select is not None: self.selects.append(self.select); self.select=None
            def handle_data(self,d):
              if self.intitle: self.title+=d.strip()
          u="http://chap.sch.ir/"
          req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0","Accept":"text/html,*/*"})
          with urllib.request.urlopen(req,timeout=40) as r:
            html=r.read().decode("utf-8","replace")
            print("STATUS",r.status,"URL",r.url,"BYTES",len(html))
          p=P(); p.feed(html)
          print("TITLE",p.title)
          print("FORMS",p.forms[:15])
          print("SELECTS",p.selects[:30])
          print("LINKS",p.links[:180])
          print("SCRIPTS",p.scripts[:80])
          print("TEXT", " ".join(html.replace("<"," <").split())[:5000])
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
