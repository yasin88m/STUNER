name: Deploy STUNER to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate application JavaScript
        run: node --check app.js && node --check curriculum.js && node --check sw.js
      - name: Probe official textbook catalog endpoints
        continue-on-error: true
        run: |
          python - <<'PY'
          import urllib.request, ssl
          ctx=ssl._create_unverified_context()
          urls=[
            "https://chap.sch.ir/","http://chap.sch.ir/","https://www.chap.sch.ir/",
            "https://chap.sch.ir/robots.txt","https://chap.sch.ir/sitemap.xml",
            "https://chap.sch.ir/books","https://chap.oerp.ir/"
          ]
          for url in urls:
            print("\\nURL",url)
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"})
              with urllib.request.urlopen(req,timeout=30,context=ctx) as r:
                data=r.read(12000)
                print("STATUS",r.status,"FINAL",r.url,"HEADERS",dict(r.headers))
                print("BODY",repr(data[:1200]))
            except Exception as e: print("ERROR",repr(e))
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
