name: Deploy STUNER to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate application JavaScript
        run: node --check app.js && node --check curriculum.js && node --check sw.js
      - name: Import official textbook catalog from chap.sch.ir
        if: ${{ !contains(github.event.head_commit.message, '[chap-catalog-sync]') }}
        run: |
          python .github/scripts/sync_chap_catalog.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chap-catalog.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: [chap-catalog-sync] refresh official textbook catalog"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
