name: Deploy STUNER to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate application JavaScript
        run: node --check app.js && node --check curriculum.js && node --check sw.js
      - name: Read official textbook publication-year options
        continue-on-error: true
        run: |
          python - <<'PY'
          import urllib.request
          from html.parser import HTMLParser
          class P(HTMLParser):
            def __init__(self): super().__init__(); self.sel=None; self.opt=None; self.data={}
            def handle_starttag(self,t,attrs):
              a=dict(attrs)
              if t=="select": self.sel={"name":a.get("name"),"options":[]}
              elif t=="option" and self.sel is not None: self.opt={"value":a.get("value",""),"text":""}
            def handle_data(self,d):
              if self.opt is not None:self.opt["text"]+=d
            def handle_endtag(self,t):
              if t=="option" and self.sel is not None and self.opt is not None:self.sel["options"].append(self.opt);self.opt=None
              elif t=="select" and self.sel is not None:self.data[self.sel["name"]]=self.sel["options"];self.sel=None
          html=urllib.request.urlopen(urllib.request.Request("http://chap.sch.ir/",headers={"User-Agent":"Mozilla/5.0"}),timeout=40).read().decode("utf-8","replace")
          p=P();p.feed(html)
          for o in p.data.get("field_year_tid",[]):print("YEAR",o["value"],repr(o["text"].strip()))
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
