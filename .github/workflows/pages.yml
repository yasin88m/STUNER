name: Deploy STUNER to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate application JavaScript
        run: node --check app.js && node --check curriculum.js && node --check sw.js
      - name: Test official textbook catalog search routes
        continue-on-error: true
        run: |
          python - <<'PY'
          import urllib.request,re,html
          urls=[
           "http://chap.sch.ir/advanced_search?tid=8&field_year_tid=1402",
           "http://chap.sch.ir/advanced_search?tid=8&field_year_tid=1402&op="+urllib.parse.quote("جستجو"),
           "http://chap.sch.ir/?q=advanced_search&tid=8&field_year_tid=1402",
           "http://chap.sch.ir/?q=advanced_search"
          ]
          for u in urls:
            try:
              req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=40) as r:data=r.read().decode("utf-8","replace");final=r.url
              title=re.search(r"<title>(.*?)</title>",data,re.S)
              books=re.findall(r'href="([^"]*/books/\d+[^"]*)"[^>]*>(.*?)</a>',data,re.S)
              clean=lambda x:re.sub(r"\s+"," ",html.unescape(re.sub(r"<[^>]+>"," ",x))).strip()
              print("TEST",u,"FINAL",final,"BYTES",len(data),"TITLE",html.unescape(title.group(1)) if title else "", "BOOKS",[(h,clean(t)) for h,t in books[:15]])
              print("HAS_FILTER", "views-exposed-form-book-search-page-1" in data,"HAS_PAGER","pager" in data)
            except Exception as e:print("ERR",u,repr(e))
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
