name: Deploy STUNER to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import official textbook catalogue
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sync-catalog]') }}
        run: |
          python -m py_compile .github/scripts/sync_chap_catalog.py
          python .github/scripts/sync_chap_catalog.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chap-catalog.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: [chap-catalog-sync] refresh official textbook catalogue"
            git push origin HEAD:main
          fi

      - name: Validate application JavaScript
        run: node --check app.js && node --check school-import.js && node --check school-portal.js && node --check teacher-portal.js && node --check stuner-jalali.js && node --check stuner-icons.js && node --check school-work.js && node --check student-cloud.js && node --check curriculum.js && node --check sw.js && node --check chap-catalog.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Wait for Pages artifact registration
        run: sleep 15

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
