name: Deploy STUNER to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate application JavaScript
        run: node --check app.js && node --check curriculum.js && node --check sw.js
      - name: Inspect chap.sch.ir search form
        continue-on-error: true
        run: |
          python - <<'PY'
          import urllib.request,re
          from html.parser import HTMLParser
          class P(HTMLParser):
            def __init__(self): super().__init__(); self.form=None; self.forms=[]; self.sel=None; self.opt=None; self.selects=[]; self.title=False
            def handle_starttag(self,t,attrs):
              a=dict(attrs)
              if t=="form": self.form={"attrs":a,"controls":[]}; self.forms.append(self.form)
              if self.form is not None and t in ("input","select","button"): self.form["controls"].append((t,a))
              if t=="select": self.sel={"attrs":a,"options":[]}
              if t=="option" and self.sel is not None:self.opt={"value":a.get("value"),"text":""}
            def handle_data(self,d):
              if self.opt is not None:self.opt["text"]+=d
            def handle_endtag(self,t):
              if t=="option" and self.opt is not None and self.sel is not None:self.sel["options"].append(self.opt);self.opt=None
              elif t=="select" and self.sel is not None:self.selects.append(self.sel);self.sel=None
              elif t=="form":self.form=None
          req=urllib.request.Request("http://chap.sch.ir/",headers={"User-Agent":"Mozilla/5.0"})
          data=urllib.request.urlopen(req,timeout=45).read().decode("utf-8","replace")
          p=P();p.feed(data)
          print("FORMS",p.forms[:20])
          for s in p.selects:
            print("SELECT",s["attrs"],"COUNT",len(s["options"]))
            for o in s["options"][:30]:print("OPT",o["value"],repr(o["text"].strip()))
          print("SEARCH_FORM_MARKERS",[(x,data.find(x)) for x in ["views-exposed-form","advanced_search","field_year_tid","field_book_code","views-field-title","name=tid","name=field"]])
          for m in re.finditer(r'<form[^>]*>',data,re.I): print("FORM_TAG",m.group(0))
          PY
      - name: Print catalog form structure
        run: |
          python - <<'PY'
          import urllib.request,json
          from html.parser import HTMLParser
          class P(HTMLParser):
            def __init__(self): super().__init__(); self.forms=[]; self.form=None; self.sel=None; self.opt=None; self.selects=[]
            def handle_starttag(self,t,attrs):
              a=dict(attrs)
              if t=="form": self.form={"attrs":a,"controls":[]}; self.forms.append(self.form)
              if self.form is not None and t in ("input","select","button"): self.form["controls"].append({"tag":t,"attrs":a})
              if t=="select": self.sel={"attrs":a,"options":[]}
              if t=="option" and self.sel is not None:self.opt={"value":a.get("value"),"text":""}
            def handle_data(self,d):
              if self.opt is not None:self.opt["text"]+=d
            def handle_endtag(self,t):
              if t=="option" and self.opt is not None and self.sel is not None:self.sel["options"].append(self.opt);self.opt=None
              elif t=="select" and self.sel is not None:self.selects.append(self.sel);self.sel=None
              elif t=="form":self.form=None
          req=urllib.request.Request("http://chap.sch.ir/",headers={"User-Agent":"Mozilla/5.0"})
          html=urllib.request.urlopen(req,timeout=45).read().decode("utf-8","replace")
          p=P();p.feed(html)
          print("FORMS_JSON",json.dumps(p.forms,ensure_ascii=False))
          for s in p.selects:
            print("SELECT_NAME",s["attrs"].get("name"),"ID",s["attrs"].get("id"),"COUNT",len(s["options"]))
            if len(s["options"])<200:
              print("OPTIONS",json.dumps(s["options"],ensure_ascii=False))
            else:
              opts=s["options"]
              relevant=[i for i,o in enumerate(opts) if any(k in o["text"] for k in ["پایه دهم","پایه یازدهم","پایه دوازدهم","متوسطه نظری","فنی و حرفه","کاردانش","دوره آموزش ابتدایی","دوره اول آموزش متوسطه"])]
              print("RELEVANT_OPTION_INDICES",[(i,opts[i]["value"],opts[i]["text"].strip()) for i in relevant[:220]])
          PY
      - name: Verify catalog search filters
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,re,html
          from html.parser import HTMLParser
          class P(HTMLParser):
            def __init__(self):super().__init__();self.links=[];self.inlink=False;self.link=None;self.title="";self.intitle=False
            def handle_starttag(self,t,attrs):
              a=dict(attrs)
              if t=="title":self.intitle=True
              if t=="a" and "/books/" in a.get("href",""):self.link={"href":a["href"],"text":""}
            def handle_data(self,d):
              if self.inlink and self.link:self.link["text"]+=d
              if self.intitle:self.title+=d
            def handle_endtag(self,t):
              if t=="title":self.intitle=False
              if t=="a" and self.link:self.links.append(self.link);self.link=None
          for tid in ["29","30","711","40","157","629","553","8"]:
            q=urllib.parse.urlencode({"tid":tid,"field_year_tid":"1402"})
            u="http://chap.sch.ir/advanced_search?"+q
            req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
            data=urllib.request.urlopen(req,timeout=45).read().decode("utf-8","replace")
            p=P();p.feed(data)
            clean=lambda x:re.sub(r"\\s+"," ",html.unescape(re.sub(r"<[^>]+>"," ",x))).strip()
            print("QUERY",tid,"TITLE",clean(p.title),"BYTES",len(data),"BOOK_LINKS",[(x["href"],clean(x["text"])) for x in p.links[:30]])
            for marker in ["views-row","view-content","views-field-title","view-empty","هیچ نتیجه"]:
              i=data.find(marker)
              if i>=0:print("SNIP",tid,marker,re.sub(r"\\s+"," ",data[max(0,i-180):i+700])[:900])
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
