name: Deploy STUNER to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate application JavaScript
        run: node --check app.js && node --check curriculum.js && node --check sw.js
      - name: Extract official textbook filter labels
        continue-on-error: true
        run: |
          python - <<'PY'
          import urllib.request,re
          from html.parser import HTMLParser
          class P(HTMLParser):
            def __init__(self):
              super().__init__(); self.sel=None; self.opt=None; self.data={}
            def handle_starttag(self,t,attrs):
              a=dict(attrs)
              if t=="select": self.sel={"name":a.get("name"),"options":[]}
              elif t=="option" and self.sel is not None: self.opt={"value":a.get("value",""),"text":""}
            def handle_data(self,d):
              if self.opt is not None: self.opt["text"]+=d
            def handle_endtag(self,t):
              if t=="option" and self.sel is not None and self.opt is not None:
                self.sel["options"].append(self.opt); self.opt=None
              elif t=="select" and self.sel is not None:
                self.data[self.sel["name"]]=self.sel["options"]; self.sel=None
          req=urllib.request.Request("http://chap.sch.ir/",headers={"User-Agent":"Mozilla/5.0"})
          html=urllib.request.urlopen(req,timeout=40).read().decode("utf-8","replace")
          p=P();p.feed(html)
          for name,opts in p.data.items():
            print("\\nSELECT",name,"COUNT",len(opts))
            if name=="field_year_tid":
              for o in opts: print("YEAR",o["value"],repr(o["text"].strip()))
            elif name=="tid":
              pat=re.compile(r"اول|دوم|سوم|چهارم|پنجم|ششم|هفتم|هشتم|نهم|دهم|یازدهم|دوازدهم|ابتدایی|متوسطه|فنی|حرفه|کاردانش|نظری|صنعت|هنر|خدمات|کشاورزی|ریاضی|تجربی|انسانی|معارف|معماری|حسابداری|تربیت کودک|شبکه|الکتروتکنیک|عمومی",re.I)
              for o in opts:
                t=o["text"].strip()
                if pat.search(t): print("TERM",o["value"],repr(t))
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
